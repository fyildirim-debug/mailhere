[package]
name = "mailhere"
description = "Mailhere masaüstü e-posta istemcisi"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
default-run = "mailhere"

[[bin]]
name = "mailhere"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
mh-app.workspace = true
mh-core.workspace = true
mh-sync.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Masaüstü: varsayılan özellikler (sıkıştırma, X11, D-Bus...) + tepsi simgesi.
tauri = { workspace = true, default-features = true, features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance.workspace = true
tauri-plugin-notification.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-updater.workspace = true
keyring = { workspace = true, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
serde.workspace = true

# Açılışta başlama (Windows: HKCU Run anahtarı) ve tepsi denetimi (Linux:
# AppIndicator kitaplığı, StatusNotifier izleyicisi, X11 tepsisi). Hepsi
# bağımlılık ağacında zaten var (MIT / Apache-2.0).
[target.'cfg(windows)'.dependencies]
windows-registry = "0.6.1"
# Pano (doğrulama kodunu kendiliğinden kopyalama): Win32 çağrıları doğrudan.
# `arboard` Windows'ta BSL-1.0 lisanslı `clipboard-win`e dayandığı için
# kullanılmadı; `windows-sys` ağaçta zaten var (bkz. `src/clipboard.rs`).
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Storage_Packaging_Appx"] }
# Microsoft Store (MSIX) kurulumunda açılışta başlama: WinRT StartupTask.
# Sürüm Tauri/WebView2 ağacındakiyle aynı (yeni kopya derlenmez).
windows = { version = "0.62.2", features = ["ApplicationModel", "Foundation", "Win32_System_WinRT"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9.12"
# Tepsi simgesi D-Bus StatusNotifierItem olarak (AppIndicator kitaplığı yok;
# sol tık pencereyi açar). Tauri'nin tray-icon'u bu özellikle ksni arka ucuna geçer.
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }
# Bildirim kartı penceresinin gravity'si (pencere yöneticisi köşeyi sabit tutsun)
# ve pano (doğrulama kodunu kendiliğinden kopyalama, `src/clipboard.rs`).
gtk = "0.18"

[features]
# `pnpm tauri build` bunu açar; geliştirmede devUrl kullanılır.
custom-protocol = ["tauri/custom-protocol"]
