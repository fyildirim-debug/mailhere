[package]
name = "mailhere"
description = "Mailhere masaüstü e-posta istemcisi"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
default-run = "mailhere"

[[bin]]
name = "mailhere"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
mh-core.workspace = true
mh-store.workspace = true
mh-mime.workspace = true
mh-sync.workspace = true
mh-send.workspace = true
mh-notify.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
rustls.workspace = true
uuid.workspace = true
tauri.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-notification.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-updater.workspace = true
keyring = { workspace = true, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[features]
# `pnpm tauri build` bunu açar; geliştirmede devUrl kullanılır.
custom-protocol = ["tauri/custom-protocol"]
