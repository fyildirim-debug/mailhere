[package]
name = "mailhere"
description = "Mailhere masaüstü e-posta istemcisi"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
default-run = "mailhere"

[[bin]]
name = "mailhere"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
mh-app.workspace = true
mh-core.workspace = true
mh-sync.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Masaüstü: varsayılan özellikler (sıkıştırma, X11, D-Bus...) + tepsi simgesi.
tauri = { workspace = true, default-features = true, features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance.workspace = true
tauri-plugin-notification.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-updater.workspace = true
keyring = { workspace = true, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
serde.workspace = true

# Açılışta başlama (Windows: HKCU Run anahtarı) ve tepsi denetimi (Linux:
# AppIndicator kitaplığı, StatusNotifier izleyicisi, X11 tepsisi). Hepsi
# bağımlılık ağacında zaten var (MIT / Apache-2.0).
[target.'cfg(windows)'.dependencies]
windows-registry = "0.6.1"

[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9.12"
libc = "0.2"
x11rb.workspace = true

[features]
# `pnpm tauri build` bunu açar; geliştirmede devUrl kullanılır.
custom-protocol = ["tauri/custom-protocol"]
