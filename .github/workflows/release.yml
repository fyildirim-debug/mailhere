name: Sürüm

on:
  push:
    tags: ['v*']
  # Elle başlatma (Actions → Sürüm → Run workflow): etiket, sürüm
  # yayımlanırken GitHub'da bu commit üzerinde oluşturulur.
  workflow_dispatch:
    inputs:
      surum:
        description: Sürüm etiketi (ör. v0.1.0); paket sürümüyle aynı olmalı
        required: true

env:
  # Etikete giden sürüm: elle başlatmada girdi, etiket gönderiminde etiketin adı.
  ETIKET: ${{ inputs.surum || github.ref_name }}

# Varsayılan: yalnız okuma. Yazma izni yalnız sürümü oluşturan işte.
permissions:
  contents: read

jobs:
  # Paketler imzasız derlenir: güncelleme imza anahtarı bu işe hiç girmez
  # (derlemede çalışan yüzlerce npm/cargo betiği anahtarı göremez). Önbellek
  # kullanılmaz; yayın derlemesi başka işlerin önbelleğiyle zehirlenemez.
  paket:
    name: Paket (${{ matrix.os }})
    # Elle başlatma yalnız main dalından.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Etiket biçimi
        shell: bash
        run: |
          if ! [[ "${ETIKET}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Geçersiz sürüm etiketi: ${ETIKET} (ör. v0.1.0)"; exit 1
          fi
          SURUM=$(node -p "require('./package.json').version")
          if [ "v${SURUM}" != "${ETIKET}" ]; then
            echo "Etiket (${ETIKET}) paket sürümüyle (${SURUM}) aynı değil."; exit 1
          fi
      - name: Linux bağımlılıkları
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev libdbus-1-dev rpm
      - name: OpenSSL için Perl (Windows)
        # SQLCipher'in OpenSSL'i kaynaktan derlenir (openssl-src); Configure
        # Windows perl'i ister. Git Bash'in MSYS perl'i MSVC hedefinde çalışmaz;
        # PATH sırasına bırakılmaz, yol açıkça verilir.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $perl = 'C:\Strawberry\perl\bin\perl.exe'
          if (-not (Test-Path $perl)) { choco install strawberryperl -y --no-progress }
          "OPENSSL_SRC_PERL=$perl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Paketle
        # OAuth istemci kimlikleri derlemeye gömülür. Tanımsız ya da boşsa
        # derleme yine geçer; Google / Microsoft düğmesi uygulama parolasına yönlendirir.
        env:
          MAILHERE_GOOGLE_CLIENT_ID: ${{ secrets.MAILHERE_GOOGLE_CLIENT_ID }}
          MAILHERE_GOOGLE_CLIENT_SECRET: ${{ secrets.MAILHERE_GOOGLE_CLIENT_SECRET }}
          MAILHERE_MICROSOFT_CLIENT_ID: ${{ secrets.MAILHERE_MICROSOFT_CLIENT_ID }}
        run: pnpm tauri build -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: paket-${{ runner.os }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 7

  # Uygulama içi güncelleme dosyaları ayrı, küçük bir işte imzalanır: yalnız
  # derlenmiş paketler indirilir ve Tauri CLI ile imzalanır; depo kodu
  # derlenmez. Anahtar "yayin" ortamında durur (ortama onaylayıcı eklenebilir).
  imza:
    name: Güncelleme imzası
    needs: paket
    runs-on: ubuntu-latest
    environment: yayin
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: paket-*
          path: paketler
          merge-multiple: true
      - name: İmzala
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY tanımlı değil; güncelleme dosyaları imzalanmadı."
            exit 0
          fi
          CLI=$(node -p "require('./package.json').devDependencies['@tauri-apps/cli']")
          VER="${ETIKET#v}"
          find paketler \( -name '*.AppImage' -o -name '*.exe' -o -name '*.msi' \) -print0 |
            while IFS= read -r -d '' f; do
              npx --yes "@tauri-apps/cli@${CLI}" signer sign --app-version "${VER}" "$f"
              # İmza, paketin klasör yapısıyla ayrı yüklenir (paketlerin yanına iner).
              rel="${f#paketler/}"
              mkdir -p "imzalar/$(dirname "$rel")"
              mv "$f.sig" "imzalar/$rel.sig"
            done
      - uses: actions/upload-artifact@v4
        with:
          name: imzalar
          path: imzalar
          if-no-files-found: ignore
          retention-days: 7

  # Paketler tek işte toplanır: sürüm bir kez oluşur, latest.json
  # iki işletim sisteminin imzalarını birlikte içerir.
  yayin:
    name: Sürümü yayımla
    needs: [paket, imza]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: paket-*
          path: paketler
          merge-multiple: true
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: imzalar
          path: paketler
      - name: Sürüm notları (docs/surumler, etiket ya da commit mesajı)
        run: |
          TAG="${ETIKET}"
          git fetch --force --no-tags --depth=1 origin "refs/tags/${TAG}:refs/tags/${TAG}" || true
          if [ -f "docs/surumler/${TAG}.md" ]; then
            cp "docs/surumler/${TAG}.md" notlar.md
          elif [ "$(git cat-file -t "${TAG}" 2>/dev/null)" = "tag" ]; then
            git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "${TAG}" > notlar.md
          else
            git log -1 --format=%B > notlar.md
          fi
          cat notlar.md
      - name: latest.json
        run: |
          if find paketler -name '*.sig' | grep -q .; then
            node scripts/latest-json.mjs --tag "${ETIKET}" --repo "${GITHUB_REPOSITORY}" \
              --notes-file notlar.md --out paketler/latest.json paketler
            cat paketler/latest.json
          else
            echo "İmza dosyası yok (TAURI_SIGNING_PRIVATE_KEY tanımlı değil); latest.json üretilmedi."
          fi
      # Doğrudan yayımlanır: uygulama içi güncelleme "en son sürüm"deki
      # latest.json'u okur (taslak sürüm görünmez).
      - uses: softprops/action-gh-release@v2
        with:
          name: Mailhere ${{ env.ETIKET }}
          tag_name: ${{ env.ETIKET }}
          # Etiket yoksa (elle başlatma) bu commit üzerinde oluşturulur.
          target_commitish: ${{ github.sha }}
          body_path: notlar.md
          draft: false
          make_latest: true
          files: |
            paketler/**/*.deb
            paketler/**/*.rpm
            paketler/**/*.AppImage
            paketler/**/*.exe
            paketler/**/*.msi
            paketler/**/*.sig
            paketler/latest.json
