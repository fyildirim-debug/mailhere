name: Mağaza paketi

# Microsoft Store için MSIX paketi. Elle (Actions → Mağaza paketi → Run
# workflow) ya da Sürüm iş akışından çağrılır. Paket imzasızdır; Partner
# Center'a yüklenince Microsoft imzalar. Deneme kurulumu için yalnız bu işte
# geçici, kendinden imzalı bir sertifika üretilir ve atılır.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  msix:
    name: MSIX
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: OpenSSL için Perl
        shell: pwsh
        run: |
          $perl = 'C:\Strawberry\perl\bin\perl.exe'
          if (-not (Test-Path $perl)) { choco install strawberryperl -y --no-progress }
          "OPENSSL_SRC_PERL=$perl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Derle
        env:
          MAILHERE_GOOGLE_CLIENT_ID: ${{ secrets.MAILHERE_GOOGLE_CLIENT_ID }}
          MAILHERE_GOOGLE_CLIENT_SECRET: ${{ secrets.MAILHERE_GOOGLE_CLIENT_SECRET }}
          MAILHERE_MICROSOFT_CLIENT_ID: ${{ secrets.MAILHERE_MICROSOFT_CLIENT_ID }}
        run: pnpm tauri build --no-bundle -- --locked
      - name: Paketle
        shell: pwsh
        run: ./packaging/msix/paketle.ps1
      # Bildirimin geçerli olduğunu ve paketin kurulduğunu denetler: kopya
      # geçici sertifikayla imzalanıp kurulur, sonra kaldırılır. Yüklenecek
      # paket imzasız kalır.
      - name: Deneme kurulumu
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msix = Get-ChildItem dist-msix/*.msix | Select-Object -First 1
          $deneme = Join-Path $env:RUNNER_TEMP "deneme.msix"
          Copy-Item $msix.FullName $deneme
          $cert = New-SelfSignedCertificate -Type Custom -KeyUsage DigitalSignature `
            -Subject "CN=CAE57BB8-AC80-4682-AD33-4FBB0E661588" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}") `
            -CertStoreLocation Cert:\CurrentUser\My
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { [version]($_.Directory.Parent.Name) } -Descending | Select-Object -First 1
          & $signtool.FullName sign /fd SHA256 /sha1 $cert.Thumbprint $deneme
          if ($LASTEXITCODE -ne 0) { throw "signtool başarısız" }
          $cer = Join-Path $env:RUNNER_TEMP "deneme.cer"
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          Add-AppxPackage -Path $deneme
          $p = Get-AppxPackage -Name ArnexLab.MailHere
          if (-not $p) { throw "Paket kurulmadı" }
          Write-Host "Kuruldu: $($p.PackageFullName)"
          Remove-AppxPackage -Package $p.PackageFullName
      - uses: actions/upload-artifact@v4
        with:
          name: magaza-msix
          path: dist-msix/*.msix
          if-no-files-found: error
          retention-days: 30
