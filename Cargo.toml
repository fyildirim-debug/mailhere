[workspace]
resolver = "2"
members = [
  "crates/mh-core",
  "crates/mh-store",
  "crates/mh-mime",
  "crates/mh-sync",
  "crates/mh-send",
  "crates/mh-notify",
  "crates/mh-oauth",
  "crates/mh-jmap",
  "crates/mh-app",
  "crates/mh-transfer",
  "src-tauri",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"
authors = ["Furkan YILDIRIM <posta@furkanyildirim.com>"]
repository = "https://github.com/fyildirim-debug/mailhere"
# Tauri 2.12 en az 1.90 ister.
rust-version = "1.90"

[workspace.dependencies]
mh-core = { path = "crates/mh-core" }
mh-store = { path = "crates/mh-store" }
mh-mime = { path = "crates/mh-mime" }
mh-sync = { path = "crates/mh-sync" }
mh-send = { path = "crates/mh-send" }
mh-notify = { path = "crates/mh-notify" }
mh-oauth = { path = "crates/mh-oauth" }
mh-jmap = { path = "crates/mh-jmap" }
mh-app = { path = "crates/mh-app" }
mh-transfer = { path = "crates/mh-transfer" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Çalışma zamanı
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
futures = "0.3.34"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
uuid = { version = "1.28.0", features = ["v4"] }
base64 = "0.22.1"

# Depo ve posta biçimi
# SQLCipher: veritabanı diskte şifreli (AES-256). OpenSSL yalnız SQLCipher'in
# libcrypto'su için kaynaktan derlenir ve statik bağlanır; TLS yine rustls.
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
mail-parser = "0.11.9"
mail-builder = "0.4.4"
ammonia = "4.1.7"

# Ağ (yalnız ring sağlayıcısı; aws-lc derlemesi Windows'ta ek araç ister)
rustls = { version = "0.23.45", default-features = false, features = ["ring", "logging", "std", "tls12"] }
# IMAP soketinde TCP canlılık yoklaması (NAT eşlemesi, ölü bağlantı).
socket2 = "0.6.5"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "logging", "tls12"] }
webpki-roots = "1.0.9"
# PKCE özeti ve güvenli rastgele değer (rustls zaten ring kullanır).
ring = "0.17.14"
# Bellekteki anahtar kopyalarını düşerken sıfırlamak için.
zeroize = "1.9.1"
# QR ile ayar aktarımı: yerel arayüz adresleri ve QR matrisi (görsel özellikleri kapalı).
if-addrs = "0.15.0"
qrcode = { version = "0.14.1", default-features = false }
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
hickory-resolver = { version = "0.26.3", default-features = false, features = ["tokio", "system-config"] }
# 0.41 öncesi RUSTSEC-2026-0194'ten etkilenir.
quick-xml = "0.42.0"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-webpki-roots"] }
# `hostname` özelliği bilerek kapalı: EHLO ve Message-ID makine adını sızdırmasın.
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }

# Sertifika onayı (inceleme; parmak izi ring ile) ve testte kendinden imzalı sertifika
x509-parser = "0.18.1"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }

# Tam ekran algısı (Windows: Shell API, Linux: X11 saf Rust istemcisi)
windows-sys = { version = "0.61.2", features = ["Win32_UI_Shell"] }
x11rb = { version = "0.14.0", default-features = false }

# Testlerde sahte HTTP sunucusu (JMAP)
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
bytes = "1.12.1"

# Tauri 2.x. Ortak katman (mh-app) yalnız webview çalışma zamanını ister;
# masaüstü kabuğu varsayılan özellikleri ve tepsiyi kendi Cargo.toml'unda açar.
tauri = { version = "2.12.3", default-features = false, features = ["wry"] }
tauri-build = { version = "2.7.2", features = [] }
tauri-plugin-single-instance = "2.5.3"
tauri-plugin-notification = "2.6.0"
tauri-plugin-opener = "2.7.1"
tauri-plugin-dialog = "2.8.2"
# Uygulama içi güncelleme (imzalı paketler, GitHub sürümleri)
tauri-plugin-updater = { version = "2.13.3", default-features = false, features = ["rustls-tls", "system-proxy"] }
keyring = "3.6.3"

[profile.dev]
# Yalnız satır bilgisi: derleme klasörü küçük, geri izleme okunur kalır.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
