[workspace]
resolver = "2"
members = [
  "crates/mh-core",
  "crates/mh-store",
  "crates/mh-mime",
  "crates/mh-sync",
  "crates/mh-send",
  "crates/mh-notify",
  "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Furkan YILDIRIM <posta@furkanyildirim.com>"]
repository = "https://github.com/fyildirim-debug/mailhere"
# Tauri 2.12 en az 1.90 ister.
rust-version = "1.90"

[workspace.dependencies]
mh-core = { path = "crates/mh-core" }
mh-store = { path = "crates/mh-store" }
mh-mime = { path = "crates/mh-mime" }
mh-sync = { path = "crates/mh-sync" }
mh-send = { path = "crates/mh-send" }
mh-notify = { path = "crates/mh-notify" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Çalışma zamanı
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
futures = "0.3.34"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
uuid = { version = "1.28.0", features = ["v4"] }
base64 = "0.22.1"

# Depo ve posta biçimi
rusqlite = { version = "0.40.2", features = ["bundled"] }
mail-parser = "0.11.9"
mail-builder = "0.4.4"
ammonia = "4.1.7"

# Ağ (yalnız ring sağlayıcısı; aws-lc derlemesi Windows'ta ek araç ister)
rustls = { version = "0.23.45", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "logging", "tls12"] }
webpki-roots = "1.0.9"
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
hickory-resolver = { version = "0.26.3", default-features = false, features = ["tokio", "system-config"] }
quick-xml = "0.38.4"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-webpki-roots"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }

# Masaüstü kabuğu (kararlı Tauri 2.x)
tauri = { version = "2.12.3", features = ["tray-icon", "image-png"] }
tauri-build = { version = "2.7.2", features = [] }
tauri-plugin-single-instance = "2.5.3"
tauri-plugin-notification = "2.6.0"
tauri-plugin-opener = "2.7.1"
tauri-plugin-dialog = "2.8.2"
keyring = "3.6.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
